<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Vector favicon: crisp at every size (16px tab → 512px install icon) with no binary asset to
         ship. mask-icon covers Safari pinned tabs; theme-color tints the mobile browser chrome. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="mask-icon" href="/favicon.svg" color="#1a3287" />
    <meta name="theme-color" content="#16307d" />
    <!-- Theme, applied BEFORE first paint so there is no flash of the wrong one. Preference lives in
         localStorage 'tailorresume.theme' ('light' | 'dark'; absent = follow the system). Kept in sync
         with src/lib/theme.ts, which takes over once the app loads. -->
    <script>
      (function () {
        var p = null, t;
        try { p = localStorage.getItem('tailorresume.theme'); } catch (e) {}
        if (p === 'light' || p === 'dark') t = p;
        else t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        var d = document.documentElement;
        d.setAttribute('data-theme', t);
        d.style.colorScheme = t;
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', t === 'light' ? '#ffffff' : '#16307d');
      })();
    </script>
    <title>TailorResume</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
