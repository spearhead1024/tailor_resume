<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Apply — Senior Backend Engineer at Northwind Labs</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; color: #222; max-width: 640px; margin: 0 auto; padding: 24px; }
  h1 { font-size: 22px; } .field { margin: 12px 0; } label { display: block; font-weight: 600; margin-bottom: 4px; }
  input, select, textarea { width: 100%; padding: 8px; border: 1px solid #bbb; border-radius: 6px; font: inherit; box-sizing: border-box; }
  .req { color: #c00; } button { background: #1a7f37; color: #fff; border: 0; padding: 10px 18px; border-radius: 6px; font: inherit; }
</style></head>
<body>
  <h1>Senior Backend Engineer — Northwind Labs</h1>
  <form id="application_form">
    <div class="field"><label for="first_name">First Name <span class="req">*</span></label><input id="first_name" name="first_name" autocomplete="given-name"></div>
    <div class="field"><label for="last_name">Last Name <span class="req">*</span></label><input id="last_name" name="last_name" autocomplete="family-name"></div>
    <div class="field"><label for="email">Email <span class="req">*</span></label><input id="email" name="email" type="email"></div>
    <div class="field"><label for="phone">Phone</label><input id="phone" name="phone" type="tel"></div>
    <div class="field"><label for="location">Location (City)</label><input id="location" name="location"></div>
    <div class="field"><label for="resume">Resume/CV <span class="req">*</span></label><input id="resume" name="resume" type="file" accept=".pdf,.doc,.docx"></div>
    <div class="field"><label for="linkedin">LinkedIn Profile</label><input id="linkedin" name="linkedin"></div>
    <div class="field"><label for="website">Website</label><input id="website" name="website"></div>
    <div class="field"><label for="sponsor">Will you now or in the future require visa sponsorship?</label>
      <select id="sponsor" name="sponsor"><option value="">Select…</option><option>Yes</option><option>No</option></select></div>
    <div class="field"><label for="why">Why do you want to work at Northwind Labs?</label><textarea id="why" name="why" rows="4"></textarea></div>
    <button type="submit">Submit application</button>
  </form>
</body></html>
